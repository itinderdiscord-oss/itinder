<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iTinder — Painel de cliques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#12040c;
    --card:#210a16;
    --card-line:rgba(255,111,165,0.18);
    --hot:#ff1f6d;
    --hot-2:#ff5f9e;
    --soft:#ffb8d1;
    --paper:#fff3f7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(60% 50% at 82% -8%, rgba(255,63,129,0.30), transparent 60%),
      radial-gradient(50% 40% at 8% 108%, rgba(255,31,109,0.22), transparent 60%),
      var(--void);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.brand{font-family:'Baloo 2',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:26px 6vw;flex-wrap:wrap;
  }
  .brand{
    display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;
  }
  .brand svg{filter:drop-shadow(0 0 10px rgba(255,31,109,0.8));}
  .status{
    display:flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:0.6px;text-transform:uppercase;
    color:rgba(255,243,247,0.5);
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;background:#3ddc84;
    box-shadow:0 0 8px 2px rgba(61,220,132,0.7);
    animation:pulse 1.8s ease-in-out infinite;
  }
  .status.offline .dot{background:#ff4d4d;box-shadow:0 0 8px 2px rgba(255,77,77,0.7);animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  main{max-width:920px;margin:0 auto;padding:2vh 6vw 8vh;}

  .headline{margin-bottom:44px;}
  .headline .eyebrow{
    font-size:13px;font-weight:600;letter-spacing:0.5px;
    color:var(--soft);margin:0 0 10px;
  }
  .headline h1{
    font-size:clamp(1.7rem,4.2vw,2.6rem);margin:0;font-weight:700;line-height:1.15;
  }

  .hero-count{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:26px;
    padding:44px 6vw;
    text-align:center;
    position:relative;
    overflow:hidden;
    margin-bottom:28px;
  }
  .hero-count::before{
    content:"";position:absolute;inset:-50% -10% auto -10%;height:200%;
    background:radial-gradient(circle, rgba(255,63,129,0.22), transparent 60%);
    pointer-events:none;
  }
  .hero-count .label{
    position:relative;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
    color:rgba(255,184,209,0.65);margin-bottom:14px;
  }
  .hero-count .num{
    position:relative;
    font-size:clamp(3.4rem,14vw,6.2rem);
    font-weight:800;line-height:1;
    color:var(--paper);
    text-shadow:0 0 44px rgba(255,31,109,0.55);
  }
  .hero-count .num .beat{
    display:inline-block;
    animation:tick 0.4s ease;
  }
  @keyframes tick{
    0%{transform:scale(1.18); color:var(--hot-2);}
    100%{transform:scale(1); color:var(--paper);}
  }
  .hero-count .sub{
    position:relative;margin-top:10px;font-size:0.95rem;color:rgba(255,243,247,0.55);
  }

  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:28px;
  }
  @media (max-width:560px){.grid{grid-template-columns:1fr;}}

  .stat-card{
    background:var(--card);border:1px solid var(--card-line);border-radius:20px;
    padding:24px 22px;
  }
  .stat-card .label{
    font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:rgba(255,184,209,0.6);margin-bottom:10px;
  }
  .stat-card .value{
    font-size:2rem;font-weight:700;color:var(--paper);
  }

  .breakdown{
    background:var(--card);border:1px solid var(--card-line);border-radius:20px;
    padding:26px 26px 22px;
  }
  .breakdown h2{
    font-size:1rem;font-weight:600;margin:0 0 20px;color:var(--paper);
  }
  .bar-row{margin-bottom:16px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .top{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:0.9rem;margin-bottom:7px;
  }
  .bar-row .name{color:rgba(255,243,247,0.8);font-weight:500;text-transform:capitalize;}
  .bar-row .count{color:var(--soft);font-weight:600;}
  .bar-track{
    height:9px;border-radius:999px;background:rgba(255,255,255,0.06);overflow:hidden;
  }
  .bar-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--hot),var(--hot-2));
    width:0%;
    transition:width 0.6s ease;
  }

  .empty, .error{
    text-align:center;color:rgba(255,243,247,0.5);padding:30px 10px;font-size:0.95rem;
  }
  .error{color:#ff9d9d;}

  footer{
    text-align:center;padding:20px 6vw 40px;color:rgba(255,243,247,0.35);font-size:0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M12 21s-7.2-4.35-9.6-8.7C.8 8.6 2.6 5 6.1 5c2 0 3.4 1 4.5 2.4C11.7 6 13.1 5 15.1 5c3.5 0 5.3 3.6 3.7 7.3C19.2 16.65 12 21 12 21z" fill="#ff1f6d"/>
    </svg>
    iTinder · Painel
  </div>
  <div class="status" id="status">
    <span class="dot"></span>
    <span id="status-text">Conectando...</span>
  </div>
</header>

<main>
  <div class="headline">
    <p class="eyebrow">Contagem em tempo real</p>
    <h1>Quantas pessoas clicaram pra entrar no Discord.</h1>
  </div>

  <div class="hero-count">
    <div class="label">Total de cliques</div>
    <div class="num mono" id="total-count">—</div>
    <div class="sub" id="last-updated">Carregando dados...</div>
  </div>

  <div class="grid">
    <div class="stat-card">
      <div class="label">Últimas 24h</div>
      <div class="value mono" id="last24-count">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Botões ativos</div>
      <div class="value mono" id="sources-count">—</div>
    </div>
  </div>

  <div class="breakdown">
    <h2>Cliques por botão</h2>
    <div id="breakdown-body">
      <div class="empty">Carregando...</div>
    </div>
  </div>
</main>

<footer>Atualiza automaticamente a cada 15 segundos.</footer>

<script>
  // Troque pela URL da sua API no Render, se for diferente
  const STATS_API_URL = "https://itinder.onrender.com/api/stats";
  const REFRESH_MS = 15000;

  let lastTotal = null;

  function setStatus(online) {
    const el = document.getElementById("status");
    const text = document.getElementById("status-text");
    el.classList.toggle("offline", !online);
    text.textContent = online ? "Ao vivo" : "Sem conexão";
  }

  function renderBreakdown(bySource) {
    const container = document.getElementById("breakdown-body");
    if (!bySource || bySource.length === 0) {
      container.innerHTML = '<div class="empty">Nenhum clique registrado ainda.</div>';
      return;
    }
    const max = Math.max(...bySource.map((s) => s.count));
    container.innerHTML = bySource
      .map((s) => {
        const pct = max > 0 ? Math.round((s.count / max) * 100) : 0;
        return `
          <div class="bar-row">
            <div class="top">
              <span class="name">${s.source}</span>
              <span class="count mono">${s.count}</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      })
      .join("");
  }

  async function loadStats() {
    try {
      const res = await fetch(STATS_API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Resposta não OK: " + res.status);
      const data = await res.json();

      const totalEl = document.getElementById("total-count");
      const isFirstLoad = lastTotal === null;
      const changed = !isFirstLoad && data.total !== lastTotal;

      totalEl.innerHTML = changed
        ? `<span class="beat">${data.total}</span>`
        : `${data.total}`;

      lastTotal = data.total;

      document.getElementById("last24-count").textContent = data.last_24h ?? 0;
      document.getElementById("sources-count").textContent = (data.by_source || []).length;
      document.getElementById("last-updated").textContent =
        "Atualizado às " + new Date().toLocaleTimeString("pt-BR");

      renderBreakdown(data.by_source);
      setStatus(true);
    } catch (err) {
      console.error("Erro ao buscar estatísticas:", err);
      setStatus(false);
      document.getElementById("last-updated").textContent =
        "Não foi possível conectar à API.";
    }
  }

  loadStats();
  setInterval(loadStats, REFRESH_MS);
</script>

</body>
</html>
